            const iconEl = document.getElementById('toast-icon');
            if (!box || !msgEl || !iconEl) return;

            msgEl.textContent = msg;
            iconEl.className = isError
                ? 'fa-solid fa-circle-exclamation text-rose-400 text-lg'
                : 'fa-solid fa-circle-check text-emerald-400 text-lg';

            box.classList.remove('translate-y-24', 'opacity-0');
            box.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                box.classList.remove('translate-y-0', 'opacity-100');
                box.classList.add('translate-y-24', 'opacity-0');
            }, 3000);

            if (bankData.qrisUrl) {
                if (qrisImg) { qrisImg.src = bankData.qrisUrl; qrisImg.classList.remove('hidden'); }
                if (qrisIcon) qrisIcon.classList.add('hidden');
            } else {
                if (qrisImg) qrisImg.classList.add('hidden');
                if (qrisIcon) qrisIcon.classList.remove('hidden');
            }

            const inputBankName = document.getElementById('input-bank-name');
            const inputBankAcc = document.getElementById('input-bank-acc');
            const inputBankHolder = document.getElementById('input-bank-holder');
            if (inputBankName) inputBankName.value = bankData.bankName;
            if (inputBankAcc) inputBankAcc.value = bankData.accNumber;
            if (inputBankHolder) inputBankHolder.value = bankData.accHolder;

        async function searchCityLocation() {
            const query = document.getElementById('city-search-input').value.trim();
            const resultsBox = document.getElementById('city-search-results');
            const searchBtn = document.getElementById('city-search-btn');

            if (query.length < 3) {
                showToast('Masukkan minimal 3 huruf nama kota/kabupaten.', true);
                return;
            }

            searchBtn.disabled = true;
            searchBtn.textContent = 'Mencari...';
            resultsBox.innerHTML = '<div class="p-3 text-xs text-slate-500 text-center">Mencari data wilayah...</div>';
            resultsBox.classList.remove('hidden');

            try {
                const res = await fetch(`https://api.myquran.com/v2/sholat/kota/cari/${encodeURIComponent(query)}`);
                const json = await res.json();

                if (json.status && Array.isArray(json.data) && json.data.length > 0) {
                    resultsBox.innerHTML = '';
                    json.data.forEach(city => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'w-full text-left px-3.5 py-2.5 hover:bg-emerald-50 text-slate-800 font-medium text-xs flex items-center justify-between transition';
                        btn.innerHTML = `<span><i class="fa-solid fa-location-dot text-emerald-600 mr-2"></i>${city.lokasi}</span><span class="text-[11px] text-emerald-700 font-semibold">Pilih</span>`;
                        btn.onclick = () => fetchPrayerByCityId(city.id, city.lokasi);
                        resultsBox.appendChild(btn);
                    });
                } else {
                    resultsBox.innerHTML = '<div class="p-3 text-xs text-rose-600 text-center">Kota tidak ditemukan. Coba kata kunci lain.</div>';
                }
            } catch (err) {
                resultsBox.innerHTML = '<div class="p-3 text-xs text-rose-600 text-center">Gagal terhubung ke server jadwal sholat. Gunakan edit manual di bawah.</div>';
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Cari';
            }
        }

        async function fetchPrayerByCityId(cityId, cityName) {
            const resultsBox = document.getElementById('city-search-results');
            resultsBox.innerHTML = '<div class="p-3 text-xs text-emerald-700 font-medium text-center">Mengambil jadwal sholat...</div>';

            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');

            try {
                const res = await fetch(`https://api.myquran.com/v2/sholat/jadwal/${cityId}/${yyyy}/${mm}/${dd}`);
                const json = await res.json();

                if (json.status && json.data && json.data.jadwal) {
                    const j = json.data.jadwal;
                    const formattedCity = cityName
                        .toLowerCase()
                        .replace(/\b\w/g, l => l.toUpperCase());

                    document.getElementById('edit-location-label').value = formattedCity;
                    document.getElementById('edit-time-imsak').value = j.imsak;
                    document.getElementById('edit-time-subuh').value = j.subuh;
                    document.getElementById('edit-time-dzuhur').value = j.dzuhur;
                    document.getElementById('edit-time-ashar').value = j.ashar;
                    document.getElementById('edit-time-maghrib').value = j.maghrib;
                    document.getElementById('edit-time-isya').value = j.isya;

                    resultsBox.classList.add('hidden');
                    showToast(`Jadwal untuk ${formattedCity} dimuat. Klik "Simpan Jadwal Sholat".`);
                } else {
                    resultsBox.innerHTML = '<div class="p-3 text-xs text-rose-600 text-center">Jadwal tidak tersedia untuk tanggal ini.</div>';
                }
            } catch (err) {
                resultsBox.innerHTML = '<div class="p-3 text-xs text-rose-600 text-center">Gagal mengambil data jadwal sholat.</div>';
            }
        }

        function openFolderManageModal() {
            const modal = document.getElementById('folder-manage-modal');
            renderFolderManageList();
            document.getElementById('folder-create-form').reset();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeFolderManageModal() {
            const modal = document.getElementById('folder-manage-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderFolderManageList() {
            const container = document.getElementById('folder-list-container');
            if (!container) return;
            container.innerHTML = '';

            galleryFolders.forEach((f, idx) => {
                const count = galleryPhotos.filter(p => p.folderId === f.id).length;
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs';
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-folder text-emerald-600"></i>
                        <span class="font-bold text-slate-800">${f.name}</span>
                        <span class="text-[10px] text-slate-400 bg-slate-200/80 px-2 py-0.5 rounded-md">${count} foto</span>
                    </div>
                    ${galleryFolders.length > 1 ? `
                        <button type="button" onclick="deleteFolder('${f.id}')" class="p-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 transition" title="Hapus Folder">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    ` : '<span class="text-[10px] text-slate-400">Default</span>'}
                `;
                container.appendChild(row);
            });
        }

        function deleteFolder(folderId) {
            if (galleryFolders.length <= 1) {
                showToast('Minimal harus ada 1 folder dokumentasi.', true);
                return;
            }
            galleryFolders = galleryFolders.filter(f => f.id !== folderId);
            galleryPhotos = galleryPhotos.filter(p => p.folderId !== folderId);
            if (activeGalleryFolder === folderId) activeGalleryFolder = 'all';

            saveGalleryToStorage();
            renderGalleryFoldersBar();
            renderGalleryGrid(activeGalleryFolder);
            renderFolderManageList();
            showToast('Folder dokumentasi berhasil dihapus.');
        }

        function renderGalleryFoldersBar() {
            const bar = document.getElementById('gallery-folders-bar');
            if (!bar) return;
            bar.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.type = 'button';
            allBtn.className = activeGalleryFolder === 'all'
                ? 'px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-700 text-white shadow-sm transition'
                : 'px-4 py-2 rounded-xl text-sm font-semibold bg-white text-slate-700 hover:bg-emerald-50 border border-slate-200 transition';
            allBtn.textContent = (translations[currentLang] || translations.id).filters.allFolder;
            allBtn.onclick = () => {
                activeGalleryFolder = 'all';
                renderGalleryFoldersBar();
                renderGalleryGrid('all');
            };
            bar.appendChild(allBtn);

            galleryFolders.forEach(f => {
                const isAct = activeGalleryFolder === f.id;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = isAct
                    ? 'px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-700 text-white shadow-sm transition flex items-center gap-1.5'
                    : 'px-4 py-2 rounded-xl text-sm font-semibold bg-white text-slate-700 hover:bg-emerald-50 border border-slate-200 transition flex items-center gap-1.5';
                btn.innerHTML = `<i class="fa-solid fa-folder text-xs"></i> ${f.name}`;
                btn.onclick = () => {
                    activeGalleryFolder = f.id;
                    renderGalleryFoldersBar();
                    renderGalleryGrid(f.id);
                };
                bar.appendChild(btn);
            });
        }

        function renderGalleryGrid(folderId = 'all') {
            const grid = document.getElementById('gallery-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const filtered = folderId === 'all'
                ? galleryPhotos
                : galleryPhotos.filter(p => p.folderId === folderId);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center bg-white rounded-3xl border border-slate-200">
                        <i class="fa-regular fa-images text-4xl text-slate-300 mb-2"></i>
                        <p class="text-sm font-semibold text-slate-600">Belum ada foto dokumentasi di folder ini.</p>
                        <button type="button" onclick="openPhotoUploadModal()" class="mt-3 px-4 py-2 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-bold hover:bg-emerald-100 transition">Unggah Foto Sekarang</button>
                    </div>
                `;
                return;
            }

            filtered.forEach(photo => {
                const folderObj = galleryFolders.find(f => f.id === photo.folderId);
                const folderName = folderObj ? folderObj.name : 'Umum';

                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between group';
                card.innerHTML = `
                    <div class="relative h-52 overflow-hidden bg-slate-100">
                        <img src="${photo.imageUrl}" alt="${photo.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/600x400/064e3b/ffffff?text=Dokumentasi+Masjid'">
                        <span class="absolute top-3 left-3 px-3 py-1 rounded-full bg-emerald-950/80 backdrop-blur-xs text-white text-[11px] font-semibold">
                            <i class="fa-solid fa-folder text-gold-400 mr-1"></i> ${folderName}
                        </span>
                    </div>
                    <div class="p-5 flex flex-col justify-between flex-1">
                        <div>
                            <span class="text-[11px] text-slate-400 block mb-1"><i class="fa-regular fa-calendar mr-1"></i> ${photo.date}</span>
                            <h4 class="font-bold text-slate-900 text-base leading-snug">${photo.title}</h4>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <button type="button" onclick="deletePhoto(${photo.id})" class="text-xs text-rose-600 hover:text-rose-800 font-semibold flex items-center gap-1" title="Hapus Foto">
                                <i class="fa-solid fa-trash"></i> Hapus
                            </button>
                            <span class="text-[11px] text-emerald-700 font-bold">DKM Al-Ikhlas</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function deletePhoto(photoId) {
            galleryPhotos = galleryPhotos.filter(p => p.id !== photoId);
            saveGalleryToStorage();
            renderGalleryGrid(activeGalleryFolder);
            renderFolderManageList();
            showToast('Foto dokumentasi berhasil dihapus.');
        }

        function openFasilitasModal(index = -1) {
            const modal = document.getElementById('fasilitas-modal');
            const titleEl = document.getElementById('fasilitas-modal-title');
            const deleteBtn = document.getElementById('delete-fasilitas-btn');

            document.getElementById('edit-fasilitas-index').value = index;

            if (index >= 0 && index < fasilitasData.length) {
                const item = fasilitasData[index];
                titleEl.textContent = 'Edit Fasilitas Masjid';
                document.getElementById('edit-fasilitas-title').value = item.title;
                document.getElementById('edit-fasilitas-icon').value = item.icon;
                document.getElementById('edit-fasilitas-desc').value = item.desc;
                deleteBtn.classList.remove('hidden');
            } else {
                titleEl.textContent = 'Tambah Fasilitas Baru';
                document.getElementById('fasilitas-edit-form').reset();
                document.getElementById('edit-fasilitas-index').value = '-1';
                deleteBtn.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeFasilitasModal() {
            const modal = document.getElementById('fasilitas-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function deleteCurrentFasilitas() {
            const idx = parseInt(document.getElementById('edit-fasilitas-index').value, 10);
            if (idx >= 0 && idx < fasilitasData.length) {
                fasilitasData.splice(idx, 1);
                saveFasilitasToStorage();
                renderFasilitas();
                closeFasilitasModal();
                showToast('Fasilitas berhasil dihapus.');
            }
        }

        function renderFasilitas() {
            const grid = document.getElementById('fasilitas-grid');
            if (!grid) return;
            grid.innerHTML = '';

            fasilitasData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between group relative';
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-700 flex items-center justify-center text-xl group-hover:scale-110 transition">
                                <i class="fa-solid ${item.icon}"></i>

                            <button type="button" onclick="openFasilitasModal(${idx})" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 flex items-center justify-center transition" title="Edit Fasilitas">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                        </div>
                        <h3 class="font-extrabold text-slate-900 text-lg mb-2">${item.title}</h3>
                        <p class="text-xs text-slate-600 leading-relaxed">${item.desc}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 text-[11px] text-emerald-700 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-circle-check"></i> ${(translations[currentLang] || translations.id).sections.fasilitasAvail}
                    </div>

                grid.appendChild(card);
            });
        }

        // Finance Transactions Controls
        function saveFinanceToStorage() {
            localStorage.setItem('masjid_custom_finance_tx', JSON.stringify(financeTransactions));
            localStorage.setItem('masjid_custom_base_saldo', baseSaldoKas);
        }

        function openFinanceModal(index = -1) {
            const modal = document.getElementById('finance-modal');
            const titleEl = document.getElementById('finance-modal-title');
            const deleteBtn = document.getElementById('delete-tx-btn');
            document.getElementById('edit-base-saldo').value = baseSaldoKas;

            document.getElementById('edit-tx-index').value = index;

            if (index >= 0 && index < financeTransactions.length) {
                const tx = financeTransactions[index];
                titleEl.textContent = 'Edit Transaksi Kas';
                document.getElementById('edit-tx-type').value = tx.type;
                document.getElementById('edit-tx-date').value = tx.date;
                document.getElementById('edit-tx-desc').value = tx.desc;
                document.getElementById('edit-tx-category').value = tx.category;
                document.getElementById('edit-tx-amount').value = tx.amount;
                deleteBtn.classList.remove('hidden');
            } else {
                titleEl.textContent = 'Tambah Transaksi Baru';
                document.getElementById('finance-edit-form').reset();
                document.getElementById('edit-tx-date').value = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                document.getElementById('edit-tx-index').value = '-1';
                deleteBtn.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeFinanceModal() {
            const modal = document.getElementById('finance-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function updateBaseSaldo() {
            const val = parseInt(document.getElementById('edit-base-saldo').value, 10);
            if (isNaN(val) || val < 0) {
                showToast('Saldo dasar harus angka valid.', true);
                return;
            }
            baseSaldoKas = val;
            saveFinanceToStorage();
            renderFinance();
            showToast('Saldo dasar kas berhasil diperbarui!');
        }

        function deleteCurrentTransaction() {
            const idx = parseInt(document.getElementById('edit-tx-index').value, 10);
            if (idx >= 0 && idx < financeTransactions.length) {
                financeTransactions.splice(idx, 1);
                saveFinanceToStorage();
                renderFinance();
                closeFinanceModal();
                showToast('Transaksi kas berhasil dihapus.');
            }
        }

        function resetFinanceDefault() {
            financeTransactions = JSON.parse(JSON.stringify(defaultFinanceTransactions));
            baseSaldoKas = defaultBaseSaldo;
            localStorage.removeItem('masjid_custom_finance_tx');
            localStorage.removeItem('masjid_custom_base_saldo');
            renderFinance();
            closeFinanceModal();
            showToast('Mutasi kas dikembalikan ke default.');
        }

        function renderFinance() {
            let totalIn = 0;
            let totalOut = 0;

            financeTransactions.forEach(tx => {
                if (tx.type === 'in') totalIn += tx.amount;
                else totalOut += tx.amount;
            });

            const currentSaldo = baseSaldoKas + totalIn - totalOut;

            const totalSaldoEl = document.getElementById('total-saldo');
            const heroLiveSaldoEl = document.getElementById('hero-live-saldo');
            const totalMasukEl = document.getElementById('total-masuk');
            const totalKeluarEl = document.getElementById('total-keluar');

            if (totalSaldoEl) totalSaldoEl.textContent = formatRupiah(currentSaldo);
            if (heroLiveSaldoEl) heroLiveSaldoEl.textContent = formatRupiah(currentSaldo);
            if (totalMasukEl) totalMasukEl.textContent = formatRupiah(totalIn);
            if (totalKeluarEl) totalKeluarEl.textContent = formatRupiah(totalOut);

            const tbody = document.getElementById('finance-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (financeTransactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400 text-xs">Belum ada transaksi tercatat.</td></tr>`;
                return;
            }

            financeTransactions.forEach((tx, idx) => {
                const isIn = tx.type === 'in';
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition';
                tr.innerHTML = `
                    <td class="py-3.5 px-6 font-medium text-slate-600 whitespace-nowrap text-xs">${tx.date}</td>
                    <td class="py-3.5 px-6 font-bold text-slate-900 text-xs">${tx.desc}</td>
                    <td class="py-3.5 px-6 whitespace-nowrap text-xs"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${isIn ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">${tx.category}</span></td>
                    <td class="py-3.5 px-6 text-right font-mono font-bold text-xs ${isIn ? 'text-emerald-700' : 'text-rose-600'}">${isIn ? '+' : '-'}${tx.amount.toLocaleString('id-ID')}</td>
                    <td class="py-3.5 px-4 text-center whitespace-nowrap">
                        <button type="button" onclick="openFinanceModal(${idx})" class="p-1.5 rounded-lg bg-slate-100 hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 transition" title="Edit Transaksi">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
